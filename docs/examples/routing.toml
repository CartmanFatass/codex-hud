# Synthetic roster for the fixed roles. Names are profile labels.
# Credentials, home directories, and account paths stay out of this file.
# env_profile is a name. The private file may map it under env_profiles.
# This example leaves that table out; the name is not a path.
# codex-zsh: wrapper is codex or codex2 and selects the account.
# Do not also set that account home in env_profiles; the combination is rejected.
# Target model and Jev decision model are separate fields.

schema = 1
default_preset = "daily"

[backends.argon]
executor = "jev"
target = "aistudio"
mode = "argon"

[backends.pro]
executor = "jev"
target = "chatgpt-pro"
mode = "pro"
model = "GPT-6"

[backends.grok-build]
executor = "herdr"
harness = "grok"
model = "grok-4.7"
effort = "high"
recipe = "grok"

[backends.claude-opus]
executor = "herdr"
harness = "claude"
model = "opus"
effort = "high"
recipe = "claude"

[backends.pi-fast]
executor = "herdr"
harness = "pi"
model = "mistral/deepseek-v4-1-flash-1017"
effort = "max"
recipe = "pi-role"

[backends.pi-imp]
executor = "herdr"
harness = "pi"
model = "mistral/deepseek-v4-1-flash-1017"
effort = "max"
recipe = "pi-role"

[backends.jev-local]
executor = "jev"
target = "browser"

[backends.codex-test]
executor = "herdr"
harness = "codex"
model = "gpt-6-luna"
effort = "medium"
recipe = "codex-zsh"
wrapper = "codex2"
env_profile = "codex2"

[backends.codex-test.args]
service_tier = "default"

[jev_decisions.typesafe-default]
provider = "typesafe"

[jev_decisions.openai-decisions]
provider = "openai"
model = "gpt-6-luna"

[presets.daily]
description = "Web oracles, Grok implementer, Claude review, Pi for small work, local browser."
jev_decisions = "typesafe-default"

[presets.daily.roles]
"oracle.propose" = "argon"
"oracle.converge" = "pro"
imp = "grok-build"
reviewer = "claude-opus"
sonic = "pi-fast"
jev = "jev-local"

[presets.pi-build]
description = "Daily oracles and review, with the Pi implementer on imp."
jev_decisions = "typesafe-default"

[presets.pi-build.roles]
"oracle.propose" = "argon"
"oracle.converge" = "pro"
imp = "pi-imp"
reviewer = "claude-opus"
sonic = "pi-fast"
jev = "jev-local"

# Internal pi helpers are independent of the public reviewer preset (Claude here).
# Missing fields use these HUD defaults; only model and effort are accepted.
# Sonic supports low/high; reviewer uses pi's effort vocabulary and startup checks.
# Effective helpers are copied at parent creation; existing parents keep their pair.
# Adopting these tables is optional. Older executables reject them: when rolling
# back, restore the matching routing configuration rather than silently stripping it.
[pi_helpers.sonic]
model = "mistral/deepseek-v4-1-flash-1017"
effort = "high"

[pi_helpers.reviewer]
model = "openai/gpt-6.1-sol"
effort = "xhigh"
