name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The only supported line (engines >=24); Node 22.13 failed watcher tests (2026-11-12).
        node: [24]
        no_color: ['', '1']
    env:
      NO_COLOR: ${{ matrix.no_color }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:fixtures
