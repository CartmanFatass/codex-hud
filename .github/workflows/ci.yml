name: CI

on:
  push:
    branches: [main, universal-hud]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The only supported line (engines >=24); Node 22.13 failed watcher tests (2026-11-12).
        node: [24]
        no_color: ['', '1']
    env:
      NO_COLOR: ${{ matrix.no_color }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Restore the vendored lock stamp for npm test and a clean tree for the release packager.
      - run: git restore -- node_modules
      - run: npm test
      - run: npm run test:release
      - run: npm run check:fixtures

  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.8.1
        with:
          workspaces: native
      - run: cargo build --locked
      - run: cargo test --locked
