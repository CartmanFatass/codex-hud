name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supports node:sqlite without flags and the execve panel-reload tests.
        node: [24]
        no_color: ['', '1']
    env:
      NO_COLOR: ${{ matrix.no_color }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:fixtures

  cx-continue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cx-continue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest
      # Unit tests only: the e2e suite drives a fake codex in a real tmux session.
      - run: python3 -m pytest tests/unit -q
        env:
          PYTHONPATH: src
